name: Local app checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Smoke test the production app
        run: |
          npm run start > /tmp/employher-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              npm run smoke
              npm run smoke:opportunities
              npm run smoke:profile
              exit 0
            fi
            sleep 1
          done
          cat /tmp/employher-next.log
          exit 1

      - name: Install browser for profile integration checks
        run: npx playwright install --with-deps chromium
      - name: Check profile browser flow
        run: npm run test:browser
      - name: Check judge demo walkthrough
        run: npm run test:demo
